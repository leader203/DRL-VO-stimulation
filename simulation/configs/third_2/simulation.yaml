# 文件路径相对于此 YAML；坐标 [m]、速度 [m/s]、时间 [s]、朝向 [deg]。
# 场景必须使用米制 Z-up。省略 actors 时按 count 随机出生并执行默认行为。
schema_version: 1
navigation:
  backend: ros2
  waypoint_frame: world_m
  settings_path: ../runtime/ros2_navigation.yaml
scene:
  asset_path: "../../../../navigation_data_synthesis/assets/THIRD_2.usd"
  layers:
    - "entry_door_overrides.usda"

simulation:
  duration: 60.0
  seed: 42
  report_path: "output/status.json"
pedestrians:
  assets: ../runtime/characters.yaml

  defaults:
    speed: 0.9
    gender: male

  actors:
    walker_01:
      behavior: walk
      position: [-5.59083, -2.05939, 0.0] # 初始世界坐标，m
      yaw: 0.0 # 出生旋转，deg
      start_time: 3.0 # 仿真第 3 秒开始行走
      repeat: true # 沿路线往返并重复
      waypoints:
        - position: [-0.28984, -0.69517, 0.0]
          wait: 2.0 # 到达并完成转向后计时
          yaw: 90.0 # 到达后的世界朝向

        - position: [-0.13128, -0.59996, 0.0]
          wait: 4.0
          yaw: 180.0
        - position: [-3.01526, 0.22165, 0.0]
          wait: 4.0
          yaw: 180.0

    walker_02:
      behavior: walk
      position: [2.01784, 1.11961, 0.0] # 初始世界坐标，m
      yaw: 0.0 # 出生旋转，deg
      start_time: 3.0 # 仿真第 3 秒开始行走
      repeat: true # 沿路线往返并重复
      waypoints:
        - position: [-2.99617, 1.18446, 0.0]
          wait: 2.0 # 到达并完成转向后计时
          yaw: 90.0 # 到达后的世界朝向
        - position: [-6.0548, -2.66496, 0.0]
          wait: 3.0 # 到达并完成转向后计时
          yaw: 90.0 # 到达后的世界朝向

    walker_03:
      behavior: walk
      position: [-6.10329, -1.25881, 0.0] # 初始世界坐标，m
      yaw: 0.0 # 出生旋转，deg
      start_time: 3.0 # 仿真第 3 秒开始行走
      repeat: true # 沿路线往返并重复
      waypoints:
        - position: [3.65718, -0.51585, 0.0]
          wait: 10.0 # 到达并完成转向后计时
          yaw: 90.0 # 到达后的世界朝向

        - position: [-2.83195, 1.09997, 0.0]
          wait: 2.0 # 到达并完成转向后计时
          yaw: 90.0 # 到达后的世界朝向

    walker_04:
      behavior: walk
      position: [3.4206, 1.18759, 0.0] # 初始世界坐标，m
      yaw: 0.0 # 出生旋转，deg
      start_time: 3.0 # 仿真第 3 秒开始行走
      repeat: true # 沿路线往返并重复
      waypoints:
        - position: [-2.95681, 1.21219, 0.0]
          wait: 2.0 # 到达并完成转向后计时
          yaw: 90.0 # 到达后的世界朝向
        - position: [-5.19092, -1.16101, 0.0]
          wait: 4.0 # 到达并完成转向后计时
          yaw: 180.0 # 到达后的世界朝向


# 人数由 actors 条目推导；增加或删除角色时无需同步维护 count。
